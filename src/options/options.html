<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Additional Settings | Fobles</title>
    <link rel="stylesheet" href="options.css" />
    <style>
      /* Persisted log actions: six buttons (four in the markup, two added by options.js) in equal-width columns.
         The global `button` rule already makes them look identical; only `.settings-button { min-width: 200px }` differed. */
      #persisted-logs .settings-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      #persisted-logs .settings-actions > button {
        width: 100%;
        min-width: 0;
      }
      @media (max-width: 720px) {
        #persisted-logs .settings-actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div id="options-root"></div>
    <aside class="build-info">
      <div>Fobles for Sitecore</div>
      <div>Build: <strong>__BUILD_STAMP__</strong></div>
      <div>Created by: <strong>Gregory Mertens</strong></div>
    </aside>
    <script src="options.js"></script>
  </body>
</html>
