<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fobles</title>
    <style>
      :root {
        --blue: #2f6fed;
        --blue-deep: #245ed4;
        --border: #d8e4f2;
        --text: #203047;
        --muted: #6d7d90;
        --surface: #f5f8fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: var(--surface);
        color: var(--text);
        font-family: "Open Sans", Arial, sans-serif;
        font-size: 12px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 700;
      }

      ol {
        margin: 0 0 12px 18px;
        padding: 0;
        line-height: 1.55;
      }

      .shortcut {
        display: inline-block;
        padding: 1px 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: #ffffff;
        font-family: Consolas, monospace;
        font-size: 11px;
      }

      .hint {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.45;
      }

      #view-persisted-logs{
        margin-bottom: 8px;
      }

      .visibility-setting {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #ffffff;
        cursor: pointer;
      }

      .visibility-setting input {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      button {
        width: 100%;
        min-height: 28px;
        border: 1px solid rgba(47, 111, 237, 0.2);
        border-radius: 3px;
        background: linear-gradient(180deg, var(--blue) 0%, var(--blue-deep) 100%);
        color: #ffffff;
        cursor: pointer;
        font:
          400 12px "Open Sans",
          Arial,
          sans-serif;
      }

      #reload-extension {
        margin-bottom: 8px;
        background: #ffffff;
        border-color: var(--border);
        color: var(--text);
      }

      .build-info {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="popup-root"></div>
    <aside class="build-info">
      <div>Fobles for Sitecore</div>
      <div>Build: <strong>__BUILD_STAMP__</strong></div>
      <div>Created by: <strong>Gregory Mertens</strong></div>
    </aside>
    <script src="popup.js"></script>
  </body>
</html>
